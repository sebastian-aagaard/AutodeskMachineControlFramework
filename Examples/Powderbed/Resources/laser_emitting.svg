<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- Laser emitting indicator: enable pin high, the RTC emits the pulse-modulated emission train. -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="360" rx="12" fill="#111827"/>

  <!-- laser head with active beam -->
  <rect x="60" y="48" width="120" height="56" rx="8" fill="#374151" stroke="#22c55e" stroke-width="2"/>
  <rect x="180" y="64" width="24" height="24" rx="4" fill="#1f2937" stroke="#22c55e" stroke-width="2"/>
  <line x1="204" y1="76" x2="420" y2="76" stroke="#ef4444" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="420,64 448,76 420,88" fill="#ef4444" filter="url(#glow)"/>
  <text x="120" y="36" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9ca3af">CO2 laser</text>

  <!-- status badge -->
  <rect x="452" y="48" width="140" height="40" rx="20" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <circle cx="478" cy="68" r="8" fill="#22c55e" filter="url(#glow)"/>
  <text x="496" y="74" font-family="sans-serif" font-size="16" fill="#4ade80">EMITTING</text>

  <!-- pulse modulation timing diagram (square wave) -->
  <line x1="60" y1="200" x2="580" y2="200" stroke="#374151" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="60" y1="280" x2="580" y2="280" stroke="#374151" stroke-width="1"/>
  <path d="M 60 280 L 90 280 L 90 200 L 150 200 L 150 280 L 210 280 L 210 200 L 270 200 L 270 280 L 330 280 L 330 200 L 390 200 L 390 280 L 450 280 L 450 200 L 510 200 L 510 280 L 580 280"
        fill="none" stroke="#22c55e" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>

  <text x="44" y="206" text-anchor="end" font-family="sans-serif" font-size="14" fill="#6b7280">ON</text>
  <text x="44" y="286" text-anchor="end" font-family="sans-serif" font-size="14" fill="#6b7280">OFF</text>
  <text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4ade80">Enable pin high &#8211; pulse-modulated emission</text>
</svg>
